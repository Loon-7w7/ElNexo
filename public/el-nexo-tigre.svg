  <path d="M256 344v10c0 10-8 16-17 16s-15-6-15-12M256 354c0 10 8 16 17 16s15-6 15-12" fill="none" stroke="#2a1a22" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
