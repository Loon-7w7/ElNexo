  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Orejas -->
  <g>
    <circle cx="138" cy="150" r="66" fill="#16111c"/>
    <circle cx="138" cy="150" r="54" fill="url(#fur)"/>
    <circle cx="146" cy="160" r="30" fill="#fff4e8"/>
    <circle cx="374" cy="150" r="66" fill="#16111c"/>
    <circle cx="374" cy="150" r="54" fill="url(#fur)"/>
    <circle cx="366" cy="160" r="30" fill="#fff4e8"/>
  </g>

