  <ellipse cx="312" cy="222" rx="24" ry="13" fill="#fff4e8" transform="rotate(12 312 222)"/>

  <!-- Ojos -->
  <g>
    <path d="M150 262c18-24 58-30 82-8-10 26-44 40-72 30-8-3-14-12-10-22z" fill="#16111c"/>
    <path d="M160 262c16-16 46-20 62-6-10 18-34 28-54 21-6-2-10-9-8-15z" fill="url(#iris)"/>
    <ellipse cx="194" cy="265" rx="5" ry="15" fill="#16111c"/>
