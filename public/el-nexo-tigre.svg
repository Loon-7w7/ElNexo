  <path d="M208 140c-9 3-11 10-7 18l20 30c4 5 9 3 8-3l-6-36c-2-8-8-11-15-9z" fill="#16111c"/>
  <path d="M304 140c9 3 11 10 7 18l-20 30c-4 5-9 3-8-3l6-36c2-8 8-11 15-9z" fill="#16111c"/>

  <!-- Rayas laterales -->
  <path d="M92 250c18 2 40 8 58 18 5 3 3 9-3 9-20 0-40-4-58-10z" fill="#16111c"/>
  <path d="M94 300c16-1 36 1 52 7 5 2 4 8-2 9-18 2-34 1-50-3z" fill="#16111c"/>
  <path d="M420 250c-18 2-40 8-58 18-5 3-3 9 3 9 20 0 40-4 58-10z" fill="#16111c"/>
  <path d="M418 300c-16-1-36 1-52 7-5 2-4 8 2 9 18 2 34 1 50-3z" fill="#16111c"/>

